[project]
name = "esphome-git-updates"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-homeassistant-custom-component", "mypy", "types-PyYAML", "ruff==0.17.4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "custom_components/esphome_git_updates", "scripts", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# The integration, the CLI and the test helpers are imported as top-level
# modules too (see pytest's pythonpath), so ruff must know them as first-party.
src = [".", "custom_components/esphome_git_updates", "scripts", "tests"]

[tool.mypy]
# `device_builder.py` has two module names: the integration imports it as part
# of the package, and the standalone CLI (plus its tests) as top-level
# `device_builder`. mypy can only check one of them per run, so this config
# checks the integration; check the spike with:
#   MYPYPATH=custom_components/esphome_git_updates:scripts:tests mypy --config-file /dev/null \
#     --strict scripts/device_builder_cli.py tests/test_cli.py tests/test_device_builder.py
strict = true
explicit_package_bases = true
mypy_path = ".:tests"
files = [
    "custom_components/esphome_git_updates",
    "tests/conftest.py",
    "tests/fake_device_builder.py",
    "tests/fake_github.py",
    "tests/git_repo.py",
    "tests/test_config_flow.py",
    "tests/test_connection.py",
    "tests/test_git_remote.py",
    "tests/test_git_sources.py",
    "tests/test_git_updates.py",
    "tests/test_install.py",
    "tests/test_linked_device.py",
    "tests/test_packaging.py",
    "tests/test_pre_install_checks.py",
    "tests/test_progress.py",
    "tests/test_release_notes.py",
    "tests/test_reauth.py",
    "tests/test_update.py",
    "tests/test_versions.py",
    "tests/tracked_config.py",
]

[[tool.mypy.overrides]]
module = "pytest_homeassistant_custom_component.*"
ignore_missing_imports = true
follow_untyped_imports = true
