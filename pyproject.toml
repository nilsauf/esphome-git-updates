[project]
name = "esphome-git-updates"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["custom_components/esphome_git_updates", "scripts", "tests"]
testpaths = ["tests"]

[tool.mypy]
strict = true
mypy_path = "custom_components/esphome_git_updates:scripts:tests"
files = ["custom_components/esphome_git_updates/device_builder.py", "scripts/device_builder_cli.py", "tests"]
